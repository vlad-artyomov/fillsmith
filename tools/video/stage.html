<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Fillsmith — film stage</title>
    <!--
      One frame of the film is this page at one value of t. Nothing here moves on
      its own: render(t) sets every position, opacity and clock, and the recorder
      screenshots what it set. The form in the window is the real page with the
      real extension filling it; its clock is stepped by tools/video/film.js.
    -->
    <style>
        :root {
            --green: radial-gradient(120% 140% at 22% 0%, #2a8a62, #16553b 58%, #0f3a29);
            --font: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --ink: #101418;
        }

        html, body {
            margin: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
        }

        body {
            position: relative;
            background: var(--green);
            color: #fff;
            font: 16px/1.5 var(--font);
            -webkit-font-smoothing: antialiased;
        }

        /* An 8-bit video bands a gradient this dark into contour lines; a grain
           too fine to see as grain is what keeps it a gradient. */
        #grain {
            position: absolute;
            inset: 0;
            opacity: .05;
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        .abs {
            position: absolute;
        }

        #lens {
            position: absolute;
            overflow: hidden;
            border-radius: 18px;
            background: #f4f6f9;
            box-shadow: 0 50px 110px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .10);
        }

        #content {
            position: absolute;
            left: 0;
            top: 0;
            width: 960px;
            height: 826px;
            transform-origin: 0 0;
        }

        #bar {
            height: 46px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 16px;
            background: #fff;
            border-bottom: 1px solid #e3e6ec;
            box-sizing: border-box;
            color: #5b6573;
            font-size: 14px;
        }

        #bar .lights {
            display: flex;
            gap: 8px;
        }

        #bar .lights i {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: block;
        }

        #bar .url {
            flex: 1;
            margin: 0 18px;
            padding: 6px 14px;
            border-radius: 9px;
            background: #f1f3f5;
        }

        #bar .tool {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: #e7f3ed;
            display: grid;
            place-items: center;
        }

        #app {
            display: block;
            width: 960px;
            height: 780px;
            border: 0;
            background: #f4f6f9;
        }

        #marks {
            position: absolute;
            left: 0;
            top: 0;
            width: 960px;
            height: 826px;
            overflow: visible;
            pointer-events: none;
        }

        .title {
            position: absolute;
            left: 120px;
            width: 640px;
            font-size: 96px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -.04em;
        }

        .text {
            position: absolute;
            left: 122px;
            width: 640px;
            font-size: 40px;
            line-height: 1.25;
            font-weight: 500;
            letter-spacing: -.012em;
            color: rgba(255, 255, 255, .92);
        }

        .keys {
            position: absolute;
            left: 120px;
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 40px;
            font-weight: 600;
            color: rgba(255, 255, 255, .7);
        }

        .key {
            min-width: 112px;
            height: 104px;
            padding: 0 28px;
            box-sizing: border-box;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: linear-gradient(#fff, #eef2f0);
            color: var(--ink);
            font-size: 40px;
            font-weight: 650;
            letter-spacing: -.01em;
        }

        .card {
            position: absolute;
            display: block;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 40px 90px rgba(0, 0, 0, .42), 0 0 0 1px rgba(255, 255, 255, .10);
        }

        #end {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #end .name {
            font-size: 120px;
            font-weight: 800;
            letter-spacing: -.045em;
            line-height: 1;
            margin-top: 40px;
        }

        #end .line {
            font-size: 52px;
            font-weight: 500;
            letter-spacing: -.02em;
            color: rgba(255, 255, 255, .92);
            margin-top: 22px;
        }

        #end .cta {
            margin-top: 64px;
            padding: 26px 48px;
            border-radius: 999px;
            background: #fff;
            color: #16553b;
            font-size: 44px;
            font-weight: 750;
            letter-spacing: -.02em;
            box-shadow: 0 30px 70px rgba(0, 0, 0, .35);
        }

        #end .url {
            margin-top: 34px;
            font-size: 32px;
            font-weight: 500;
            color: rgba(255, 255, 255, .78);
        }

        #end[hidden], #freeze[hidden] {
            display: none;
        }

        #freeze {
            position: absolute;
            left: 0;
            top: 0;
            width: 1920px;
            height: 1080px;
        }
    </style>
</head>
<body>
<canvas id="grain" width="1920" height="1080"></canvas>

<div id="lens">
    <div id="content">
        <div id="bar">
            <span class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i
                    style="background:#28c840"></i></span>
            <span class="url" id="url">staging.example.com/releases/new</span>
            <span class="tool"><canvas id="tool" width="80" height="80" style="width:20px;height:20px"></canvas></span>
        </div>
        <iframe id="app" title="form"></iframe>
        <svg id="marks" viewBox="0 0 960 826"></svg>
    </div>
</div>

<div id="copy"></div>
<div id="cards"></div>
<div id="end" hidden>
    <div style="padding:6px;border-radius:40px;background:rgba(255,255,255,.14);display:flex">
        <canvas id="endmark" width="640" height="640" style="width:160px;height:160px"></canvas></div>
    <div class="name"></div>
    <div class="line"></div>
    <div class="cta"></div>
    <div class="url"></div>
</div>
<img id="freeze" alt="" hidden>

<script src="/mark.js"></script>
<script type="module">
    import {SCENES, FPS, FILL, EPOCH, MODEL_MS, STORE_URL} from '/script.js';

    const $ = (s, r = document) => r.querySelector(s);
    const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
    const lerp = (a, b, k) => a + (b - a) * k;
    const inOut = (x) => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
    const outQuint = (x) => 1 - Math.pow(1 - clamp(x), 5);
    // 0 → 1 over [a, a + d], eased.
    const rise = (u, a, d = .6, f = out) => f((u - a) / d);

    const BAR = 46;                       // the window's toolbar, above the page
    const CONTENT = {w: 960, h: 826};
    const app = /** @type {HTMLIFrameElement} */ ($('#app'));
    const lens = $('#lens'), content = $('#content'), marks = $('#marks');

    // ------------------------------------------------------------ the grain ----
    {
        const c = /** @type {HTMLCanvasElement} */ ($('#grain'));
        const g = c.getContext('2d');
        const img = g.createImageData(c.width, c.height);
        let s = 7;
        for (let i = 0; i < img.data.length; i += 4) {
            s = (s * 1103515245 + 12345) >>> 0;     // seeded, so the grain is the same in every frame and every run
            const v = s >>> 24;
            img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
            img.data[i + 3] = 255;
        }
        g.putImageData(img, 0, 0);
    }

    // ------------------------------------------------------------- the mark ----
    // The toolbar's own drawing, and the light it passes across the mark while a fill runs.
    function paintTool(k) {
        const c = /** @type {HTMLCanvasElement} */ ($('#tool'));
        const g = c.getContext('2d');
        const size = c.width;
        g.clearRect(0, 0, size, size);
        drawMark(g, size);
        if (k == null) return;
        g.save();
        g.beginPath();
        g.roundRect(0, 0, size, size, size * 0.19);
        g.clip();
        const x = -size + k * size * 2.6;
        const band = g.createLinearGradient(x, 0, x + size * 0.62, size);
        band.addColorStop(0, 'rgba(255,255,255,0)');
        band.addColorStop(0.5, 'rgba(255,255,255,.52)');
        band.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = band;
        g.fillRect(0, 0, size, size);
        g.restore();
    }

    drawMark($('#endmark').getContext('2d'), 640);

    // ------------------------------------------------------------ the copy ----
    const copy = $('#copy');
    const el = (cls, html, parent = copy) => {
        const d = document.createElement('div');
        d.className = cls;
        d.innerHTML = html;
        parent.appendChild(d);
        return d;
    };
    for (const s of SCENES) {
        s.els = {};
        if (s.title) s.els.title = el('title', s.title);
        if (s.text) s.els.text = el('text', s.text);
        if (s.shots) s.els.shots = s.shots.map(sh => el('text', sh.text));
        if (s.keys) {
            s.els.keys = el('keys', '');
            s.els.caps = s.keys.keys.map((k, i) => {
                if (i) s.els.keys.appendChild(Object.assign(document.createElement('span'), {textContent: '+'}));
                const d = el('key', k, s.els.keys);
                return d;
            });
        }
    }
    const end = SCENES.find(s => s.id === 'end');
    $('#end .name').textContent = end.name;
    $('#end .line').textContent = end.line;
    $('#end .cta').textContent = end.cta;
    $('#end .url').textContent = STORE_URL.replace(/^https:\/\//, '');

    /* A block of copy: the title sits so the block is centred on the frame's
     * middle, the line under it a measured distance below. */
    function placeCopy(s, u) {
        const t = s.els.title, x = s.els.text || (s.els.shots && s.els.shots[0]);
        const th = t ? t.offsetHeight : 0;
        const xh = x ? x.offsetHeight + 36 : 0;
        const kh = s.els.keys ? 104 + 56 : 0;
        const top = (1080 - th - xh - kh) / 2;
        const leave = s.dur - u;
        const gone = clamp(leave / .35);           // every block fades in its last third of a second
        if (t) {
            const k = rise(u, s.id === 'fill' ? .15 : .25, .7);
            t.style.top = `${top + (1 - k) * 28}px`;
            t.style.opacity = String(k * gone);
        }
        const below = top + th + 36;
        if (s.els.text) {
            const k = rise(u, .55, .7);
            s.els.text.style.top = `${below + (1 - k) * 20}px`;
            s.els.text.style.opacity = String(k * gone);
        }
        if (s.els.shots) {
            s.shots.forEach((sh, i) => {
                const next = s.shots[i + 1];
                const k = rise(u, sh.at + .35, .55) * (next ? 1 - rise(u, next.at, .3, inOut) : gone);
                s.els.shots[i].style.top = `${below + (1 - rise(u, sh.at + .35, .55)) * 20}px`;
                s.els.shots[i].style.opacity = String(k);
            });
        }
        if (s.els.keys) {
            s.els.keys.style.top = `${below}px`;
            const k = rise(u, s.keys.at, .5);
            s.els.keys.style.opacity = String(k * gone);
            s.els.caps.forEach((cap, i) => {
                const down = rise(u, s.keys.press + i * .06, .08) * (1 - rise(u, s.keys.press + .38, .14));
                cap.style.transform = `translateY(${down * 6 + (1 - k) * 16}px)`;
                cap.style.boxShadow = `0 ${10 - down * 7}px 0 #b9c7c0, 0 ${24 - down * 14}px 40px rgba(0,0,0,${.35 - down * .15})`;
            });
        }
    }

    function hideCopy(s) {
        for (const e of [s.els.title, s.els.text, s.els.keys, ...(s.els.shots || [])]) if (e) e.style.opacity = '0';
    }

    // ------------------------------------------------------------ the takes ----
    /* What the recorder asks before every frame: which take this frame belongs
     * to, and whether its fill has been pressed yet. */
    let takeNo = -1;
    SCENES.forEach((s, i) => {
        if (s.take) takeNo++;
        s.takeNo = (s.take || s.beats) ? takeNo : -1;
        s.index = i;
    });
    const takes = [];
    SCENES.forEach(s => {
        if (s.take) takes[s.takeNo] = {page: s.take.page, scene: s, fillAt: s.start + (s.take.fillAt ?? Infinity)};
        else if (s.takeNo >= 0 && s.fillAt != null) takes[s.takeNo].fillAt = s.start + s.fillAt;
    });

    const sceneAt = (t) => SCENES.find(s => t < s.start + s.dur) || SCENES[SCENES.length - 1];

    let doc = null;              // the page in the window
    let births = new Map();      // its CSS animations, and the frame each was first seen in
    let logs = {};               // each page's fill, as rehearsed: what happened at which virtual time

    async function load(page) {
        await new Promise(r => {
            app.onload = r;
            app.src = `/${page}?film=${Date.now()}`;
        });
        doc = app.contentDocument;
        doc.documentElement.setAttribute('data-film-epoch', String(new Date(EPOCH).getTime()));
        doc.documentElement.setAttribute('data-film-model-ms', String(MODEL_MS));
        births = new Map();
        $('#url').textContent = page === 'person.html' ? 'staging.example.com/customers/new' : 'staging.example.com/releases/new';
    }

    function advance(v) {
        const d = doc.documentElement;
        if (!d.hasAttribute('data-film-ready')) return Promise.resolve();
        return new Promise(r => {
            doc.addEventListener('film-done', r, {once: true});
            d.setAttribute('data-film-to', String(v));
            doc.dispatchEvent(new Event('film-advance'));
        });
    }

    const logOf = () => JSON.parse(doc.documentElement.getAttribute('data-film-log') || '[]');

    /* The fill's log, named: the moments a script can pin a beat to. */
    function named(log) {
        const out = {};
        let opens = 0, picks = 0, pastes = 0, ais = 0, open = false, improving = false;
        for (const e of log) {
            const put = (k) => {
                if (!(k in out)) out[k] = e;
            };
            if (e.kind === 'fill') put('fill');
            else if (e.kind === 'progress' && e.stage === 'improve') {
                improving = true;
                put('improve');
            } else if (e.kind === 'progress' && e.stage === 'fill' && e.label) {
                if (improving) put(`ai:${++ais}`);
                else put(`field:${e.label}`);
            } else if (e.kind === 'open') {
                open = true;
                put(`open:${++opens}`);
            } else if (e.kind === 'close') open = false;
            else if (e.kind === 'press' && open) put(`pick:${++picks}`);
            else if (e.kind === 'paste') put(`paste:${++pastes}`);
            else if (e.kind === 'file') put('file');
            else if (e.kind === 'toast') put('toast');
        }
        return out;
    }

    /* Film time to fill time. Each beat pins a named moment of the fill to a
     * moment of the scene; in between the fill runs at whatever speed joins the
     * two. Before the press nothing has happened, and after the last beat the
     * fill runs at its own speed. */
    function remap(take) {
        const names = named(logs[take.page] || []);
        const pts = [[take.fillAt, 0]];
        for (const s of SCENES) {
            if (s.takeNo !== take.scene.takeNo || !s.beats) continue;
            for (const [name, at] of s.beats) {
                const e = names[name];
                const last = pts[pts.length - 1];
                // A beat at the instant of the one before would stop the fill's clock, and its card and rings with it.
                if (!e || e.v <= last[1]) continue;
                pts.push([Math.max(s.start + at, last[0] + 1e-3), e.v]);
            }
        }
        return (t) => {
            if (t <= pts[0][0]) return 0;
            for (let i = 1; i < pts.length; i++) {
                const [t1, v1] = pts[i];
                if (t <= t1) {
                    const [t0, v0] = pts[i - 1];
                    return lerp(v0, v1, (t - t0) / (t1 - t0));
                }
            }
            const [tl, vl] = pts[pts.length - 1];
            return vl + (t - tl) * 1000;
        };
    }

    // Fill time back to film time, for marks drawn where the fill pressed.
    function inverse(map, v, from, to) {
        let a = from, b = to;
        for (let i = 0; i < 40; i++) {
            const m = (a + b) / 2;
            if (map(m) < v) a = m;
            else b = m;
        }
        return b;
    }

    // ------------------------------------------------------------ the camera ----
    /* A shot is a part of the window (content coordinates) shown in a rect of
     * the frame. The lens is the rounded card the page is seen through. */
    const WHOLE = {lens: [860, 127, 960, 826], focus: [0, 0, 960, 826]};
    const box = (id, pad = [20, 20, 20, 20], page = doc) => {
        const n = page && page.getElementById(id);
        if (!n) return [0, 0, 960, 826];
        const r = n.getBoundingClientRect();
        return [r.left - pad[0], r.top + BAR - pad[1], r.width + pad[0] + pad[2], r.height + pad[1] + pad[3]];
    };
    const mix = (a, b, k) => a.map((x, i) => lerp(x, b[i], k));
    const mixShot = (a, b, k) => ({lens: mix(a.lens, b.lens, k), focus: mix(a.focus, b.focus, k)});

    function shoot(shot) {
        const [lx, ly, lw, lh] = shot.lens;
        const [fx, fy, fw, fh] = shot.focus;
        const s = Math.min(lw / fw, lh / fh);
        const cx = fx + fw / 2, cy = fy + fh / 2;
        Object.assign(lens.style, {left: `${lx}px`, top: `${ly}px`, width: `${lw}px`, height: `${lh}px`});
        content.style.transform = `translate(${lw / 2 - cx * s}px, ${lh / 2 - cy * s}px) scale(${s})`;
    }

    // ------------------------------------------------------------- the marks ----
    const NS = 'http://www.w3.org/2000/svg';

    function svg(tag, attrs) {
        const n = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, String(v));
        marks.appendChild(n);
        return n;
    }

    // A ring where the fill pressed, starting a moment before the press lands.
    function ripples(t, map, take) {
        const log = logs[take.page] || [];
        let last = null;
        for (const e of log) {
            if (e.kind !== 'press') continue;
            if (last && e.v - last.v < 5 && e.target === last.target) continue;
            last = e;
            const at = inverse(map, e.v, take.fillAt, take.fillAt + 40);
            // Grows into the press, and is gone a moment after it: a list that closes takes its ring with it.
            const grow = (t - (at - .28)) / .28, fade = 1 - clamp((t - at) / .05);
            if (grow < 0 || fade <= 0) continue;
            const a = Math.min(1, grow * 2) * fade;
            svg('circle', {
                cx: e.x, cy: e.y + BAR, r: 8 + 14 * out(grow),
                fill: `rgba(47,158,111,${.22 * a})`, stroke: `rgba(47,158,111,${.9 * a})`, 'stroke-width': 2
            });
        }
    }

    function caret(t, s) {
        const ty = s.typing;
        const input = doc.getElementById(ty.field);
        // Typed a key at a time, then taken back a key at a time, twice as fast.
        const n = ty.text.length;
        const typed = clamp(Math.floor((t - ty.at) / ty.every) + 1, 0, n);
        const erased = clamp(Math.floor((t - ty.erase) / (ty.every / 2)) + 1, 0, n);
        const text = ty.text.slice(0, typed - erased);
        const typedAt = t >= ty.erase ? ty.erase + (erased - 1) * ty.every / 2 : ty.at + (typed - 1) * ty.every;
        input.value = text;
        const cs = getComputedStyle(input);
        const g = document.createElement('canvas').getContext('2d');
        g.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        const r = input.getBoundingClientRect();
        const x = r.left + parseFloat(cs.paddingLeft) + parseFloat(cs.borderLeftWidth) + g.measureText(text).width + 1;
        const on = typedAt >= 0 && t - typedAt < .5 ? true : Math.floor((t - Math.max(typedAt, 0)) / .53) % 2 === 0;
        input.style.borderColor = '#1f6f4f';
        input.style.boxShadow = '0 0 0 3px rgba(31,111,79,.13)';
        if (on) svg('rect', {x, y: r.top + BAR + r.height / 2 - 10, width: 1.6, height: 20, fill: '#0f1729'});
    }

    /* Two runs of text that belong together, each underlined where it sits in
     * its field, and a line drawn from one to the other. */
    function tie(t, pair, u0) {
        const g = document.createElement('canvas').getContext('2d');
        const span = ([id, part]) => {
            const input = doc.getElementById(id);
            const cs = getComputedStyle(input);
            g.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
            const r = input.getBoundingClientRect();
            const v = input.value;
            const i = v.toLowerCase().indexOf(part.toLowerCase());
            const x0 = r.left + parseFloat(cs.paddingLeft) + parseFloat(cs.borderLeftWidth) + g.measureText(v.slice(0, Math.max(0, i))).width;
            return {x: x0, w: g.measureText(v.slice(Math.max(0, i), Math.max(0, i) + part.length)).width, y: r.top + BAR + r.height / 2, h: r.height};
        };
        const a = span(pair.from), b = span(pair.to);
        const k1 = rise(t, u0, .35), k2 = rise(t, u0 + .25, .55, inOut), k3 = rise(t, u0 + .7, .35);
        const hl = (s, k) => svg('rect', {
            x: s.x - 4, y: s.y - 13, width: (s.w + 8) * k, height: 26, rx: 6,
            fill: 'rgba(47,158,111,.16)', stroke: 'rgba(31,111,79,.55)', 'stroke-width': 1.2
        });
        if (k1 > 0) hl(a, k1);
        if (k3 > 0) hl(b, k3);
        if (k2 <= 0) return;
        // Down out of the first box, across, and into the second: a calm S, never a diagonal.
        const p0 = [a.x + a.w / 2, a.y + 14], p1 = [b.x + b.w / 2, b.y - 14];
        const same = Math.abs(a.y - b.y) < 2;
        const d = same
            ? `M ${a.x + a.w + 4} ${a.y} C ${a.x + a.w + 60} ${a.y - 70}, ${b.x - 60} ${b.y - 70}, ${b.x - 4} ${b.y}`
            : `M ${p0[0]} ${p0[1]} C ${p0[0]} ${p0[1] + 50}, ${p1[0]} ${p1[1] - 50}, ${p1[0]} ${p1[1]}`;
        const path = svg('path', {d, fill: 'none', stroke: '#1f6f4f', 'stroke-width': 2.5, 'stroke-linecap': 'round'});
        const len = path.getTotalLength();
        path.setAttribute('stroke-dasharray', `${len}`);
        path.setAttribute('stroke-dashoffset', `${len * (1 - k2)}`);
        const head = path.getPointAtLength(len * k2);
        svg('circle', {cx: head.x, cy: head.y, r: 4, fill: '#1f6f4f'});
    }

    // --------------------------------------------------------------- frames ----
    /* The page's own animations — the card's spinner, the ring around a field
     * just written — run on the film's clock, not the machine's: each is paused
     * where it was first seen and set to how long ago that was. */
    function setAnimations(t) {
        for (const a of doc.getAnimations()) {
            if (!births.has(a)) {
                births.set(a, t);
                a.pause();
            }
            a.currentTime = (t - births.get(a)) * 1000;
        }
    }

    async function imagesReady() {
        await Promise.all([...doc.images, ...document.images].map(i =>
            (i.src && !i.complete) ? i.decode().catch(() => 0) : 0));
    }

    const cards = $('#cards');
    const caps = {};

    function capture(name) {
        if (!caps[name]) {
            const img = new Image();
            img.className = 'card';
            img.src = `/cap/${name}.png`;
            img.style.opacity = '0';
            cards.appendChild(img);
            caps[name] = img;
        }
        return caps[name];
    }

    // Size a capture by its own pixels: they are taken at three times their CSS size.
    // Cut tight to what it shows; the card's own padding is the margin, not the popup's neighbours.
    function placeCard(img, x, y, zoom, k, pad = 0, dy = 24) {
        const w = img.naturalWidth / 3 * zoom;
        Object.assign(img.style, {
            left: `${x}px`, top: `${y + (1 - k) * dy}px`, width: `${w}px`, opacity: String(k), padding: `${pad}px`
        });
        return {w: w + pad * 2, h: img.naturalHeight / 3 * zoom + pad * 2};
    }

    function hideCards() {
        for (const img of Object.values(caps)) img.style.opacity = '0';
    }

    let freezeFor = -1;

    window.film = {
        takes: takes.map(tk => ({page: tk.page, at: tk.scene.start, fillAt: tk.fillAt})),
        duration: SCENES.reduce((a, s) => a + s.dur, 0),
        fps: FPS,
        fill: FILL,
        scenes: SCENES.map(s => ({id: s.id, start: s.start, dur: s.dur, dissolve: s.dissolve || 0})),
        load,
        takeOf: (t) => sceneAt(t).takeNo,
        async rehearse(to, step) {
            for (let v = step; v <= to; v += step) await advance(v);
            return logOf();
        },
        setLog(page, log) {
            logs[page] = log;
        },
        log: logOf,
        preload: (names) => Promise.all(names.map(n => capture(n).decode())),
        async frame(t) {
            const s = sceneAt(t);
            const u = t - s.start;
            marks.textContent = '';
            for (const x of SCENES) if (x !== s) hideCopy(x);
            hideCards();
            $('#end').hidden = s.id !== 'end';

            // Leaving a scene: the last frame of the one before, fading over the new one.
            const fz = /** @type {HTMLImageElement} */ ($('#freeze'));
            if (s.dissolve && u < s.dissolve) {
                if (freezeFor !== s.index) {
                    freezeFor = s.index;
                    fz.src = `/freeze.jpg?scene=${s.index}`;
                    await fz.decode().catch(() => 0);
                }
                fz.hidden = false;
                fz.style.opacity = String(1 - inOut(u / s.dissolve));
            } else fz.hidden = true;

            const take = s.takeNo >= 0 ? takes[s.takeNo] : null;
            lens.style.display = take ? '' : 'none';
            if (take) {
                const map = remap(take);
                await advance(map(t));
                setAnimations(t);
                const filling = t >= take.fillAt && !(named(logOf())).toast;
                paintTool(filling ? ((t - take.fillAt) / 1.4) % 1 : null);
                ripples(t, map, take);
                SHOTS[s.id](u, s, t);
                await imagesReady();
            }
            placeCopy(s, u);
            if (STILL[s.id]) STILL[s.id](u, s);
            return s.id;
        }
    };

    // ---------------------------------------------------------- the scenes ----
    const HOOK_LENS = [780, 150, 1020, 780];
    // The on-page card and the end of the form it sits over, in the window's bottom right.
    const CARD = [550, 474, 410, 352];
    const SIDE = [800, 110, 1000, 860];

    const SHOTS = {
        hook(u, s, t) {
            caret(u, s);
            const near = {lens: HOOK_LENS, focus: [40, BAR + 6, 563, 430]};
            shoot(mixShot(near, WHOLE, rise(u, 3.1, .9, inOut)));
        },
        fill(u, s) {
            const input = doc.getElementById('requester');
            input.style.borderColor = '';
            input.style.boxShadow = '';
            // The card is twelve-pixel type at this size: when it has its verdict, the camera goes to it.
            shoot(mixShot(WHOLE, {lens: WHOLE.lens, focus: CARD}, rise(u, s.cardAt, 1.1, inOut)));
        },
        controls(u, s) {
            /* Fixed rectangles, not the boxes of what is in them: the preview has no
             * size until its file arrives, and the editor grows when the paste lands. */
            const date = box('golive', [24, 0, 24, 0]), notes = box('notes', [24, 24, 0, 0]);
            const frames = {
                country: box('country', [24, 70, 230, 440]),
                golive: box('golive', [24, 70, 24, 280]),
                screenshot: [date[0], date[1] + 40, date[2], 200],
                // Its first two thirds: the lines run on past the lens, which reads as a long text.
                notes: [notes[0], notes[1] - 60, 600, 300]
            };
            // Each move runs to its end, however soon the next caption arrives.
            let shot = {lens: SIDE, focus: frames[s.shots[0].on]};
            for (const sh of s.shots.slice(1)) {
                shot = mixShot(shot, {lens: SIDE, focus: frames[sh.on]}, rise(u, sh.at - .15, .6, inOut));
            }
            shoot(shot);
        },
        person(u, s) {
            const f = box('form', [24, 70, 24, 24]);
            const w = 1040, h = Math.round(w * f[3] / f[2]);
            shoot({lens: [800, (1080 - h) / 2, w, h], focus: f});
            for (const tk of s.ties) tie(u, tk, tk.at);
        },
        ai(u, s) {
            const near = {lens: SIDE, focus: [40, 330, 600, 330]};
            shoot(mixShot(near, {lens: SIDE, focus: CARD}, rise(u, s.cardAt, 1.1, inOut)));
        }
    };

    const STILL = {
        ai(u, s) {
            const t = s.els.text;
            const img = capture('pill');
            placeCard(img, 120, t.offsetTop + t.offsetHeight + 56, 2.6, rise(u, s.pill.at, .6) * clamp((s.dur - u) / .35), 14);
        },
        repeat(u, s) {
            const n = clamp(Math.floor((u - s.seed.at) / s.seed.every) + 1, 0, FILL.seed.length);
            const gone = clamp((s.dur - u) / .35);
            const seed = capture(`seed-${n}`), dbg = capture('debug');
            const Z = 2.4, gap = 40, pad = 30;
            const h = (seed.naturalHeight + dbg.naturalHeight) / 3 * Z + gap + pad * 4;
            const top = (1080 - h) / 2;
            const r = placeCard(seed, 840, top, Z, rise(u, .3, .7) * gone, pad);
            placeCard(dbg, 840, top + r.h + gap, Z, rise(u, s.debug.at, .7) * gone, pad);
            // The lower card over the upper one's shadow, or the shadow lies across it like a smudge.
            seed.style.zIndex = '1';
            dbg.style.zIndex = '2';
        },
        end(u, s) {
            const e = $('#end');
            const k = rise(u, .1, .9);
            [...e.children].forEach((c, i) => {
                const ki = rise(u, .1 + i * .12, .8);
                c.style.opacity = String(ki);
                c.style.transform = `translateY(${(1 - ki) * 26}px)`;
            });
        }
    };
</script>
</body>
</html>

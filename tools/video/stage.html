<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Fillsmith — film stage</title>
    <!--
      One frame of the film is this page at one value of t. Nothing here moves on
      its own: film.frame(t) sets every position, opacity and clock, and the
      recorder screenshots what it set. The form in the window is the real page
      with the real extension filling it; its clock is stepped by tools/video/film.js.
    -->
    <style>
        :root {
            --green: radial-gradient(120% 140% at 22% 0%, #2a8a62, #16553b 58%, #0f3a29);
            --font: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --ink: #101418;
        }

        html, body {
            margin: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
        }

        body {
            position: relative;
            background: var(--green);
            color: #fff;
            font: 16px/1.5 var(--font);
            -webkit-font-smoothing: antialiased;
        }

        /* An 8-bit video bands a gradient this dark into contour lines; a grain
           too fine to see as grain is what keeps it a gradient. */
        #grain {
            position: absolute;
            inset: 0;
            opacity: .05;
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        /* Everything that belongs to a scene, so a scene can leave as one. */
        #scene {
            position: absolute;
            inset: 0;
        }

        #lens {
            position: absolute;
            overflow: hidden;
            border-radius: 24px;
            background: #f4f6f9;
            box-shadow: 0 50px 110px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .10);
        }

        #content {
            position: absolute;
            left: 0;
            top: 0;
            width: 960px;
            height: 826px;
            transform-origin: 0 0;
        }

        #bar {
            height: 46px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 16px;
            background: #fff;
            border-bottom: 1px solid #e3e6ec;
            box-sizing: border-box;
            color: #5b6573;
            font-size: 14px;
        }

        #bar .lights {
            display: flex;
            gap: 8px;
        }

        #bar .lights i {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: block;
        }

        #bar .url {
            flex: 1;
            margin: 0 18px;
            padding: 6px 14px;
            border-radius: 9px;
            background: #f1f3f5;
        }

        #bar .tool {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: #e7f3ed;
            display: grid;
            place-items: center;
        }

        #app {
            display: block;
            width: 960px;
            height: 780px;
            border: 0;
            background: #f4f6f9;
        }

        #marks {
            position: absolute;
            left: 0;
            top: 0;
            width: 960px;
            height: 826px;
            overflow: visible;
            pointer-events: none;
        }

        .title {
            position: absolute;
            left: 120px;
            width: 660px;
            font-size: 96px;
            line-height: 1.02;
            font-weight: 800;
            letter-spacing: -.035em;
        }

        /* A line comes up from behind its own edge, as type set on a slide does. */
        .title .ln {
            display: block;
            overflow: hidden;
            padding-bottom: .1em;
            margin-bottom: -.1em;
        }

        .title .ln > span {
            display: inline-block;
        }

        .text {
            position: absolute;
            left: 122px;
            width: 660px;
            font-size: 52px;
            line-height: 1.2;
            font-weight: 500;
            letter-spacing: -.015em;
            color: rgba(255, 255, 255, .92);
        }

        .list {
            position: absolute;
            left: 122px;
            display: grid;
            gap: 6px;
        }

        .list .item {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 52px;
            line-height: 1.2;
            font-weight: 600;
            letter-spacing: -.015em;
        }

        .list .item i {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #9fe3c2;
            flex: none;
        }

        .keys {
            position: absolute;
            left: 120px;
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 44px;
            font-weight: 500;
            color: rgba(255, 255, 255, .45);
        }

        .key {
            min-width: 104px;
            height: 92px;
            padding: 0 26px;
            box-sizing: border-box;
            display: grid;
            place-items: center;
            border-radius: 18px;
            background: linear-gradient(#fff, #f1f5f3);
            color: var(--ink);
            font-size: 44px;
            font-weight: 600;
            letter-spacing: -.01em;
        }

        /* The mark and the name, where every store frame has them: from the first
           press to the last claim, standing still while the scenes move under it. */
        #brand {
            position: absolute;
            left: 120px;
            top: 64px;
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -.02em;
        }

        #brand .box {
            padding: 3px;
            border-radius: 13px;
            background: rgba(255, 255, 255, .14);
            display: flex;
        }

        .card {
            position: absolute;
            display: block;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 40px 90px rgba(0, 0, 0, .42), 0 0 0 1px rgba(255, 255, 255, .10);
        }

        #end {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #end[hidden] {
            display: none;
        }

        #end .name {
            font-size: 120px;
            font-weight: 800;
            letter-spacing: -.035em;
            line-height: 1;
            margin-top: 40px;
        }

        #end .line {
            font-size: 56px;
            font-weight: 500;
            letter-spacing: -.02em;
            color: rgba(255, 255, 255, .92);
            margin-top: 22px;
        }

        #end .cta {
            margin-top: 64px;
            padding: 26px 52px;
            border-radius: 999px;
            background: #fff;
            color: #16553b;
            font-size: 48px;
            font-weight: 750;
            letter-spacing: -.02em;
            box-shadow: 0 30px 70px rgba(0, 0, 0, .35);
        }

        #end .url {
            margin-top: 30px;
            font-size: 44px;
            font-weight: 500;
            letter-spacing: -.01em;
            color: rgba(255, 255, 255, .78);
        }
    </style>
</head>
<body>
<canvas id="grain" width="1920" height="1080"></canvas>

<div id="brand"><span class="box"><canvas id="brandmark" width="88" height="88" style="width:44px;height:44px"></canvas></span>Fillsmith</div>

<div id="scene" data-mv>
    <div id="lens" data-mv>
        <div id="content" data-mv>
            <div id="bar">
                <span class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i
                        style="background:#28c840"></i></span>
                <span class="url" id="url">staging.example.com/releases/new</span>
                <span class="tool"><canvas id="tool" width="80" height="80" style="width:20px;height:20px"></canvas></span>
            </div>
            <iframe id="app" title="form"></iframe>
            <svg id="marks" viewBox="0 0 960 826"></svg>
        </div>
    </div>

    <div id="copy"></div>
    <div id="cards"></div>
    <div id="end" hidden>
        <div data-mv style="padding:6px;border-radius:40px;background:rgba(255,255,255,.14);display:flex">
            <canvas id="endmark" width="640" height="640" style="width:160px;height:160px"></canvas></div>
        <div class="name" data-mv></div>
        <div class="line" data-mv></div>
        <div class="cta" data-mv></div>
        <div class="url" data-mv></div>
    </div>
</div>

<script src="/mark.js"></script>
<script type="module">
    import {SCENES, FPS, FILL, EPOCH, MODEL_MS, POPUP_SCALE} from '/script.js';

    const $ = (s, r = document) => r.querySelector(s);
    const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
    const lerp = (a, b, k) => a + (b - a) * k;

    /* CSS's cubic-bezier, solved for x. One family for the whole film: a strong
     * ease-out for anything arriving, the same curve mirrored for anything
     * leaving, and a steep ease-in-out for the camera crossing the frame. */
    function bezier(x1, y1, x2, y2) {
        const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
        const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
        const X = (s) => ((ax * s + bx) * s + cx) * s;
        const Y = (s) => ((ay * s + by) * s + cy) * s;
        return (x) => {
            x = clamp(x);
            if (x === 0 || x === 1) return x;
            let a = 0, b = 1, s = x;
            for (let i = 0; i < 40; i++) {
                if (X(s) < x) a = s;
                else b = s;
                s = (a + b) / 2;
            }
            return Y(s);
        };
    }

    const out = bezier(0.23, 1, 0.32, 1);
    const inn = bezier(0.68, 0, 0.77, 0);
    const move = bezier(0.77, 0, 0.175, 1);
    // 0 → 1 over [a, a + d], eased.
    const rise = (u, a, d = .7, f = out) => f((u - a) / d);

    const BAR = 46;                       // the window's toolbar, above the page
    const app = /** @type {HTMLIFrameElement} */ ($('#app'));
    const stage = $('#scene'), lens = $('#lens'), content = $('#content'), marks = $('#marks');

    // ------------------------------------------------------------ the grain ----
    {
        const c = /** @type {HTMLCanvasElement} */ ($('#grain'));
        const g = c.getContext('2d');
        const img = g.createImageData(c.width, c.height);
        let s = 7;
        for (let i = 0; i < img.data.length; i += 4) {
            s = (s * 1103515245 + 12345) >>> 0;     // seeded, so the grain is the same in every frame and every run
            const v = s >>> 24;
            img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
            img.data[i + 3] = 255;
        }
        g.putImageData(img, 0, 0);
    }

    // ------------------------------------------------------------- the mark ----
    // The toolbar's own drawing, and the light it passes across the mark while a fill runs.
    function paintTool(k) {
        const c = /** @type {HTMLCanvasElement} */ ($('#tool'));
        const g = c.getContext('2d');
        const size = c.width;
        g.clearRect(0, 0, size, size);
        drawMark(g, size);
        if (k == null) return;
        g.save();
        g.beginPath();
        g.roundRect(0, 0, size, size, size * 0.19);
        g.clip();
        const x = -size + k * size * 2.6;
        const band = g.createLinearGradient(x, 0, x + size * 0.62, size);
        band.addColorStop(0, 'rgba(255,255,255,0)');
        band.addColorStop(0.5, 'rgba(255,255,255,.52)');
        band.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = band;
        g.fillRect(0, 0, size, size);
        g.restore();
    }

    drawMark($('#endmark').getContext('2d'), 640);
    drawMark($('#brandmark').getContext('2d'), 88);

    // ------------------------------------------------------------ the copy ----
    const copy = $('#copy');
    const el = (cls, html, parent = copy) => {
        const d = document.createElement('div');
        d.className = cls;
        d.innerHTML = html;
        d.setAttribute('data-mv', '');
        parent.appendChild(d);
        return d;
    };
    for (const s of SCENES) {
        s.els = {};
        if (s.title) {
            s.els.title = el('title', s.title.split('<br>').map(l => `<span class="ln"><span data-mv>${l}</span></span>`).join(''));
            s.els.lines = [...s.els.title.querySelectorAll('.ln > span')];
        }
        if (s.text) s.els.text = el('text', s.text);
        if (s.shots) {
            s.els.list = el('list', '');
            s.els.items = s.shots.map(sh => el('item', `<i></i><span>${sh.text}</span>`, s.els.list));
        }
        if (s.keys) {
            s.els.keys = el('keys', '');
            s.els.caps = s.keys.keys.map((k, i) => {
                if (i) s.els.keys.appendChild(Object.assign(document.createElement('span'), {textContent: '+'}));
                return el('key', k, s.els.keys);
            });
        }
    }
    const end = SCENES.find(s => s.id === 'end');
    $('#end .name').textContent = end.name;
    $('#end .line').textContent = end.line;
    $('#end .cta').textContent = end.cta;
    $('#end .url').textContent = end.find;

    const nextOf = (s) => SCENES[SCENES.indexOf(s) + 1];

    /* A block of copy: the title sits so the block is centred on the frame's
     * middle, what comes under it a measured distance below. */
    function placeCopy(s, u) {
        const t = s.els.title;
        const under = s.els.text || s.els.list || s.els.keys;
        const th = t ? t.offsetHeight : 0;
        const uh = under ? under.offsetHeight + 40 : 0;
        // Every title on the same line, so a push never makes the words jump; the hook alone sits centred.
        const top = s.index === 0 ? (1080 - th - uh) / 2 : 320;
        const next = nextOf(s);
        // A scene the camera carries on from takes its words away itself; one that is pushed out takes them along.
        const lift = next && next.enter === 'camera' ? inn((u - (s.dur - .3)) / .3) : 0;
        if (t) {
            t.style.top = `${top}px`;
            t.style.opacity = '1';
            // The first words of the film are there almost at once; later titles wait for their scene to arrive.
            const at = s.index === 0 ? .02 : s.id === 'fill' ? .3 : .15;
            s.els.lines.forEach((ln, i) => {
                const k = rise(u, at + i * .09, .75);
                ln.style.transform = `translateY(${(1 - k) * 108 - lift * 108}%)`;
            });
        }
        const below = top + th + 40;
        if (s.els.text) {
            const k = rise(u, .5, .7);
            Object.assign(s.els.text.style, {
                top: `${below}px`, opacity: String(k * (1 - lift)),
                transform: `translateY(${(1 - k) * 14}px)`, filter: k < 1 ? `blur(${(1 - k) * 10}px)` : 'none'
            });
        }
        if (s.els.list) {
            s.els.list.style.top = `${below}px`;
            s.els.list.style.opacity = '1';
            s.shots.forEach((sh, i) => {
                const k = rise(u, sh.at + .1, .6);
                const next = s.shots[i + 1];
                // The one being shown is lit; the ones already shown stay, dimmed, so each can still be read.
                const dim = next ? rise(u, next.at, .4) : 0;
                const item = s.els.items[i];
                item.style.opacity = String(k * (1 - .55 * dim));
                item.style.transform = `translateX(${(1 - k) * 24}px)`;
            });
        }
        if (s.els.keys) {
            s.els.keys.style.top = `${below}px`;
            const k = rise(u, s.keys.at, .5);
            s.els.keys.style.opacity = String(k * (1 - lift));
            s.els.caps.forEach((cap, i) => {
                const down = rise(u, s.keys.press + i * .05, .07) * (1 - rise(u, s.keys.press + .34, .14));
                cap.style.transform = `translateY(${down * 3 + (1 - k) * 18}px)`;
                cap.style.boxShadow = `0 ${3 - down * 2}px 0 #c6d2cc, 0 ${14 - down * 8}px 30px rgba(0,0,0,${.25 - down * .1})`;
            });
        }
    }

    function hideCopy(s) {
        for (const e of [s.els.title, s.els.text, s.els.list, s.els.keys]) if (e) e.style.opacity = '0';
    }

    /* Scenes change by pushing: the old one speeds away to the left, the cut
     * falls while it is still moving, and the new one arrives from the right at
     * the same speed and settles. The camera's own moves keep the same axis. */
    const PUSH = 260, PUSH_OUT = .3, PUSH_IN = .42;

    function pushOf(s, u) {
        const next = nextOf(s);
        if (s.enter === 'push' && u < PUSH_IN) return PUSH * (1 - out(u / PUSH_IN));
        if (next && next.enter === 'push' && u > s.dur - PUSH_OUT) return -PUSH * inn((u - (s.dur - PUSH_OUT)) / PUSH_OUT);
        return 0;
    }

    // ------------------------------------------------------------ the takes ----
    /* What the recorder asks before every frame: which take this frame belongs
     * to, and whether its fill has been pressed yet. */
    let takeNo = -1;
    SCENES.forEach((s, i) => {
        if (s.take) takeNo++;
        s.takeNo = (s.take || s.beats) ? takeNo : -1;
        s.index = i;
    });
    const takes = [];
    SCENES.forEach(s => {
        if (s.take) takes[s.takeNo] = {page: s.take.page, scene: s, fillAt: s.start + (s.take.fillAt ?? Infinity)};
        else if (s.takeNo >= 0 && s.fillAt != null) takes[s.takeNo].fillAt = s.start + s.fillAt;
    });
    takes.forEach((tk, i) => {
        tk.until = Math.max(...SCENES.filter(s => s.takeNo === i).map(s => s.start + s.dur));
    });

    const sceneAt = (t) => SCENES.find(s => t < s.start + s.dur) || SCENES[SCENES.length - 1];

    let doc = null;              // the page in the window
    let births = new Map();      // its CSS animations, and the frame each was first seen in
    let logs = {};               // each page's fill, as rehearsed: what happened at which virtual time

    async function load(page) {
        await new Promise(r => {
            app.onload = r;
            app.src = `/${page}?film=${Date.now()}`;
        });
        doc = app.contentDocument;
        doc.documentElement.setAttribute('data-film-epoch', String(new Date(EPOCH).getTime()));
        doc.documentElement.setAttribute('data-film-model-ms', String(MODEL_MS));
        births = new Map();
        $('#url').textContent = page === 'person.html' ? 'staging.example.com/customers/new' : 'staging.example.com/releases/new';
    }

    function advance(v) {
        const d = doc.documentElement;
        if (!d.hasAttribute('data-film-ready')) return Promise.resolve();
        return new Promise(r => {
            doc.addEventListener('film-done', r, {once: true});
            d.setAttribute('data-film-to', String(v));
            doc.dispatchEvent(new Event('film-advance'));
        });
    }

    const logOf = () => JSON.parse(doc.documentElement.getAttribute('data-film-log') || '[]');

    /* The fill's log, named: the moments a script can pin a beat to. */
    function named(log) {
        const out = {};
        let opens = 0, picks = 0, pastes = 0, ais = 0, open = false, improving = false;
        for (const e of log) {
            const put = (k) => {
                if (!(k in out)) out[k] = e;
            };
            if (e.kind === 'fill') put('fill');
            else if (e.kind === 'progress' && e.stage === 'improve') {
                improving = true;
                put('improve');
            } else if (e.kind === 'progress' && e.stage === 'fill' && e.label) {
                if (improving) put(`ai:${++ais}`);
                else put(`field:${e.label}`);
            } else if (e.kind === 'open') {
                open = true;
                put(`open:${++opens}`);
            } else if (e.kind === 'close') open = false;
            else if (e.kind === 'press' && open) put(`pick:${++picks}`);
            else if (e.kind === 'paste') put(`paste:${++pastes}`);
            else if (e.kind === 'file') put('file');
            else if (e.kind === 'toast') put('toast');
        }
        return out;
    }

    /* Film time to fill time. Each beat pins a named moment of the fill to a
     * moment of the scene; in between the fill runs at whatever speed joins the
     * two. Before the press nothing has happened, and after the last beat the
     * fill runs at its own speed. */
    function remap(take) {
        const names = named(logs[take.page] || []);
        const pts = [[take.fillAt, 0]];
        for (const s of SCENES) {
            if (s.takeNo !== take.scene.takeNo || !s.beats) continue;
            for (const [name, at] of s.beats) {
                const e = names[name];
                const last = pts[pts.length - 1];
                // A beat at the instant of the one before would stop the fill's clock, and its card and rings with it.
                if (!e || e.v <= last[1]) continue;
                pts.push([Math.max(s.start + at, last[0] + 1e-3), e.v]);
            }
        }
        return (t) => {
            if (t <= pts[0][0]) return 0;
            for (let i = 1; i < pts.length; i++) {
                const [t1, v1] = pts[i];
                if (t <= t1) {
                    const [t0, v0] = pts[i - 1];
                    return lerp(v0, v1, (t - t0) / (t1 - t0));
                }
            }
            /* After the last beat the fill runs at its own speed, but only so far:
             * the card takes itself away 3.2 s after its verdict, and a scene that
             * is still looking at it must not see it go. */
            const [tl, vl] = pts[pts.length - 1];
            return vl + Math.min(t - tl, 2.5) * 1000;
        };
    }

    // Fill time back to film time, for marks drawn where the fill pressed and sounds where it wrote.
    function inverse(map, v, from, to) {
        let a = from, b = to;
        for (let i = 0; i < 40; i++) {
            const m = (a + b) / 2;
            if (map(m) < v) a = m;
            else b = m;
        }
        return b;
    }

    // ------------------------------------------------------------ the camera ----
    /* A shot is a part of the window (content coordinates) shown in a rect of
     * the frame. The lens is the rounded card the page is seen through. */
    const COLUMN = 840;                   // every lens starts here and is 960 wide; only its height changes
    const WHOLE = {lens: [COLUMN, 127, 960, 826], focus: [0, 0, 960, 826]};
    const box = (id, pad = [20, 20, 20, 20], page = doc) => {
        const n = page && page.getElementById(id);
        if (!n) return [0, 0, 960, 826];
        const r = n.getBoundingClientRect();
        return [r.left - pad[0], r.top + BAR - pad[1], r.width + pad[0] + pad[2], r.height + pad[1] + pad[3]];
    };
    const mix = (a, b, k) => a.map((x, i) => lerp(x, b[i], k));
    const mixShot = (a, b, k) => ({lens: mix(a.lens, b.lens, k), focus: mix(a.focus, b.focus, k)});

    function shoot(shot) {
        const [lx, ly, lw, lh] = shot.lens;
        const [fx, fy, fw, fh] = shot.focus;
        const s = Math.min(lw / fw, lh / fh);
        const cx = fx + fw / 2, cy = fy + fh / 2;
        Object.assign(lens.style, {left: `${lx}px`, top: `${ly}px`, width: `${lw}px`, height: `${lh}px`});
        content.style.transform = `translate(${lw / 2 - cx * s}px, ${lh / 2 - cy * s}px) scale(${s})`;
    }

    // ------------------------------------------------------------- the marks ----
    const NS = 'http://www.w3.org/2000/svg';

    function svg(tag, attrs) {
        const n = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, String(v));
        marks.appendChild(n);
        return n;
    }

    // The presses a take shows, once each: a press the filler repeats on the same target is one gesture.
    function pressesOf(take) {
        const kept = [];
        for (const e of logs[take.page] || []) {
            if (e.kind !== 'press') continue;
            const last = kept[kept.length - 1];
            if (last && e.v - last.v < 5 && e.target === last.target) continue;
            kept.push(e);
        }
        return kept;
    }

    // A ring where the fill pressed, starting a moment before the press lands.
    function ripples(t, map, take) {
        for (const e of pressesOf(take)) {
            const at = inverse(map, e.v, take.fillAt, take.until);
            // Grows into the press, and is gone a moment after it: a list that closes takes its ring with it.
            const grow = (t - (at - .28)) / .28, fade = 1 - clamp((t - at) / .05);
            if (grow < 0 || fade <= 0) continue;
            const a = Math.min(1, grow * 2) * fade;
            svg('circle', {
                cx: e.x, cy: e.y + BAR, r: 8 + 14 * out(grow),
                fill: `rgba(47,158,111,${.22 * a})`, stroke: `rgba(47,158,111,${.9 * a})`, 'stroke-width': 2
            });
        }
    }

    // What the hook's field holds at time u, and when its last key went down.
    function typed(ty, u) {
        const n = ty.text.length;
        const down = clamp(Math.floor((u - ty.at) / ty.every) + 1, 0, n);
        const back = clamp(Math.floor((u - ty.erase) / (ty.every / 2)) + 1, 0, n);
        const last = u >= ty.erase ? ty.erase + (back - 1) * ty.every / 2 : ty.at + (down - 1) * ty.every;
        return {text: ty.text.slice(0, down - back), last};
    }

    function caret(u, s) {
        const ty = s.typing;
        const input = doc.getElementById(ty.field);
        const {text, last} = typed(ty, u);
        input.value = text;
        const cs = getComputedStyle(input);
        const g = document.createElement('canvas').getContext('2d');
        g.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        const r = input.getBoundingClientRect();
        const x = r.left + parseFloat(cs.paddingLeft) + parseFloat(cs.borderLeftWidth) + g.measureText(text).width + 1;
        const on = last >= 0 && u - last < .5 ? true : Math.floor((u - Math.max(last, 0)) / .53) % 2 === 0;
        input.style.borderColor = '#1f6f4f';
        input.style.boxShadow = '0 0 0 3px rgba(31,111,79,.13)';
        if (on) svg('rect', {x, y: r.top + BAR + r.height / 2 - 10, width: 1.6, height: 20, fill: '#0f1729'});
    }

    /* Two runs of text that belong together, each underlined where it sits in
     * its field, and a line drawn from one to the other. */
    function tie(t, pair, u0) {
        const g = document.createElement('canvas').getContext('2d');
        const span = ([id, part]) => {
            const input = doc.getElementById(id);
            const cs = getComputedStyle(input);
            g.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
            const r = input.getBoundingClientRect();
            const v = input.value;
            const i = v.toLowerCase().indexOf(part.toLowerCase());
            const x0 = r.left + parseFloat(cs.paddingLeft) + parseFloat(cs.borderLeftWidth) + g.measureText(v.slice(0, Math.max(0, i))).width;
            return {x: x0, w: g.measureText(v.slice(Math.max(0, i), Math.max(0, i) + part.length)).width, y: r.top + BAR + r.height / 2, h: r.height};
        };
        const a = span(pair.from), b = span(pair.to);
        const k1 = rise(t, u0, .35), k2 = rise(t, u0 + .25, .55, move), k3 = rise(t, u0 + .7, .35);
        const hl = (s, k) => svg('rect', {
            x: s.x - 4, y: s.y - 13, width: (s.w + 8) * k, height: 26, rx: 6,
            fill: 'rgba(47,158,111,.16)', stroke: 'rgba(31,111,79,.55)', 'stroke-width': 1.2
        });
        if (k1 > 0) hl(a, k1);
        if (k3 > 0) hl(b, k3);
        if (k2 <= 0) return;
        /* Side by side: an arc over the gap between them. One above the other: a
         * bracket in the left margin, so the line never crosses the label between. */
        const same = Math.abs(a.y - b.y) < 2;
        const edge = Math.min(a.x, b.x) - 22;
        const d = same
            ? `M ${a.x + a.w + 4} ${a.y} C ${a.x + a.w + 60} ${a.y - 70}, ${b.x - 60} ${b.y - 70}, ${b.x - 10} ${b.y}`
            : `M ${a.x - 10} ${a.y} C ${edge} ${a.y}, ${edge} ${b.y}, ${b.x - 10} ${b.y}`;
        const path = svg('path', {d, fill: 'none', stroke: '#1f6f4f', 'stroke-width': 2.5, 'stroke-linecap': 'round'});
        const len = path.getTotalLength();
        path.setAttribute('stroke-dasharray', `${len}`);
        path.setAttribute('stroke-dashoffset', `${len * (1 - k2)}`);
        const head = path.getPointAtLength(len * k2);
        svg('circle', {cx: head.x, cy: head.y, r: 4, fill: '#1f6f4f'});
    }

    // --------------------------------------------------------------- frames ----
    /* The page's own animations — the card's spinner, the ring around a field
     * just written — run on the film's clock, not the machine's: each is paused
     * where it was first seen and set to how long ago that was. */
    function setAnimations(t) {
        for (const a of doc.getAnimations()) {
            if (!births.has(a)) {
                births.set(a, t);
                a.pause();
            }
            a.currentTime = (t - births.get(a)) * 1000;
        }
    }

    async function imagesReady() {
        await Promise.all([...doc.images, ...document.images].map(i =>
            (i.src && !i.complete) ? i.decode().catch(() => 0) : 0));
    }

    const cards = $('#cards');
    const caps = {};

    function capture(name) {
        if (!caps[name]) {
            const img = new Image();
            img.className = 'card';
            img.src = `/cap/${name}.png`;
            img.style.opacity = '0';
            img.setAttribute('data-mv', '');
            cards.appendChild(img);
            caps[name] = img;
        }
        return caps[name];
    }

    // Size a capture by its own pixels: they are taken at POPUP_SCALE times their CSS size.
    // Cut tight to what it shows; the card's own padding is the margin, not the popup's neighbours.
    function placeCard(img, x, y, zoom, k, pad = 0, dy = 24, bare = false) {
        const w = img.naturalWidth / POPUP_SCALE * zoom, h = img.naturalHeight / POPUP_SCALE * zoom + pad * 2;
        Object.assign(img.style, {
            left: `${x}px`, top: `${y + (1 - k) * dy}px`, width: `${w}px`, opacity: String(k), padding: `${pad}px`,
            // A cut-out casts its shadow from its own outline, not from a box around it.
            background: bare ? 'transparent' : '', borderRadius: bare ? '0' : '',
            boxShadow: bare ? 'none' : h < 200 ? '0 18px 40px rgba(0,0,0,.30), 0 0 0 1px rgba(255,255,255,.10)' : '',
            filter: bare ? 'drop-shadow(0 12px 22px rgba(0,0,0,.28))' : ''
        });
        return {w: w + pad * 2, h};
    }

    function hideCards() {
        for (const img of Object.values(caps)) img.style.opacity = '0';
    }

    /* Everything that moves, as one string: two frames with the same one show
     * nothing moving between them, so the recorder takes the frame once rather
     * than blurring it from several. */
    const signature = () => [...document.querySelectorAll('[data-mv]')]
        .map(e => `${e.style.transform}|${e.style.left}|${e.style.top}|${e.style.width}|${e.style.height}`).join(';');

    // Lay out the words and cards of a scene at u, without its window.
    function still(s, u) {
        const fill = SCENES.find(x => x.id === 'fill'), last = SCENES.find(x => x.id === 'end');
        const t = s.start + u;
        $('#brand').style.opacity = String(rise(t, fill.start + .1, .6) * (1 - rise(t, last.start - .3, .3, inn)));
        for (const x of SCENES) if (x !== s) hideCopy(x);
        hideCards();
        $('#end').hidden = s.id !== 'end';
        stage.style.transform = `translateX(${pushOf(s, u)}px)`;
        placeCopy(s, u);
        if (STILL[s.id]) STILL[s.id](u, s);
    }

    window.film = {
        takes: takes.map(tk => ({page: tk.page, at: tk.scene.start, fillAt: tk.fillAt, until: tk.until})),
        duration: SCENES.reduce((a, s) => a + s.dur, 0),
        fps: FPS,
        fill: FILL,
        scenes: SCENES.map(s => ({id: s.id, start: s.start, dur: s.dur, enter: s.enter || '', take: s.takeNo})),
        load,
        takeOf: (t) => sceneAt(t).takeNo,
        async rehearse(to, step) {
            for (let v = step; v <= to; v += step) await advance(v);
            return logOf();
        },
        setLog(page, log) {
            logs[page] = log;
        },
        log: logOf,
        preload: (names) => Promise.all(names.map(n => capture(n).decode())),
        /* `t` is the instant exposed; `at` the frame it belongs to. The page holds
         * at the frame across its exposures and only the camera and the words move
         * between them: a form that reflowed mid-exposure came out double. */
        async frame(t, at = t) {
            const s = sceneAt(at);
            const u = t - s.start;
            marks.textContent = '';
            const take = s.takeNo >= 0 ? takes[s.takeNo] : null;
            lens.style.display = take ? '' : 'none';
            if (take) {
                const map = remap(take);
                await advance(map(at));
                setAnimations(at);
                const filling = at >= take.fillAt && !(named(logOf())).toast;
                paintTool(filling ? ((at - take.fillAt) / 1.4) % 1 : null);
                if (s.rings !== false) ripples(at, map, take);
                SHOTS[s.id](u, s, t);
                await imagesReady();
            }
            still(s, u);
            return {id: s.id, sig: signature()};
        },

        /* How long every piece of copy is readable, against how long it needs:
         * a second per thirteen characters and half a second more, and how big
         * it is. Walks the whole film at 30 steps a second, without the window. */
        audit() {
            const seen = new Map();
            const lens0 = lens.style.display;
            lens.style.display = 'none';
            for (let t = 0; t < this.duration; t += 1 / 30) {
                const s = sceneAt(t);
                still(s, t - s.start);
                const pieces = [s.els.title, s.els.text, ...(s.els.items || []), s.els.keys,
                    ...(s.id === 'end' ? [...$('#end').children].slice(1) : [])].filter(Boolean);
                for (const e of pieces) {
                    const r = e.getBoundingClientRect();
                    const cs = getComputedStyle(e);
                    const op = Number(cs.opacity) * Number(getComputedStyle(e.parentElement).opacity);
                    // A title is readable once its lines have come up; a dimmed list item still is.
                    const settled = [...e.querySelectorAll('.ln > span')]
                        .every(l => Math.abs(parseFloat(l.style.transform.slice('translateY('.length)) || 0) < 2);
                    const ok = op > .4 && settled && r.left >= 0 && r.right <= 1920;
                    const key = e;
                    if (!seen.has(key)) seen.set(key, {text: e.innerText.replace(/\s+/g, ' ').trim(), px: parseFloat(cs.fontSize), quiet: e.hasAttribute('data-quiet'), runs: [], run: 0});
                    const rec = seen.get(key);
                    if (ok) rec.run += 1 / 30;
                    else if (rec.run) {
                        rec.runs.push(rec.run);
                        rec.run = 0;
                    }
                }
            }
            lens.style.display = lens0;
            return [...seen.values()].map(r => {
                if (r.run) r.runs.push(r.run);
                const shown = r.runs.length ? Math.max(...r.runs) : 0;
                return {text: r.text, px: r.px, quiet: r.quiet, shown: Math.round(shown * 100) / 100, needs: Math.round((r.text.length / 13 + .5) * 100) / 100};
            });
        },

        /* Where the sound goes: every key, press, field written and scene change,
         * in film seconds, from the same logs and remaps the pictures use. */
        cues() {
            const cues = [];
            const add = (t, kind) => cues.push({t: Math.round(t * 1000) / 1000, kind});
            for (const s of SCENES) {
                if (s.typing) {
                    const ty = s.typing;
                    for (let i = 0; i < ty.text.length; i++) add(s.start + ty.at + i * ty.every, 'key');
                    for (let i = 0; i < ty.text.length; i++) add(s.start + ty.erase + i * ty.every / 2, 'key');
                }
                if (s.keys) s.keys.keys.forEach((_, i) => add(s.start + s.keys.press + i * .05, 'cap'));
                if (s.enter === 'push') add(s.start, 'whoosh');
                if (s.cardAt != null) add(s.start + s.cardAt, 'swell');
                if (s.ties) s.ties.forEach(tk => add(s.start + tk.at + .25, 'tie'));
                if (s.seed) for (let i = 0; i < FILL.seed.length; i++) add(s.start + s.seed.at + i * s.seed.every, 'key');
                if (s.debug) add(s.start + s.debug.at, 'tie');
                if (s.pill) add(s.start + s.pill.at, 'tie');
            }
            takes.forEach(take => {
                const map = remap(take);
                const at = (v) => inverse(map, v, take.fillAt, take.until);
                let improving = false, last = -1;
                for (const e of logs[take.page] || []) {
                    let kind = null;
                    if (e.kind === 'progress' && e.stage === 'improve') improving = true;
                    else if (e.kind === 'progress' && e.stage === 'fill' && e.label) kind = improving ? 'ai' : 'field';
                    else if (e.kind === 'file') kind = 'pop';
                    else if (e.kind === 'paste' && !improving) kind = 'field';
                    else if (e.kind === 'toast') kind = 'done';
                    if (!kind) continue;
                    const t = at(e.v);
                    if (t >= take.until) continue;
                    // A burst of writes in one instant is one sound, not a buzz.
                    if (kind === 'field' && t - last < .06) continue;
                    if (kind === 'field') last = t;
                    add(t, kind);
                }
                for (const e of pressesOf(take)) {
                    const t = at(e.v);
                    if (t < take.until) add(t, 'press');
                }
            });
            return cues.sort((a, b) => a.t - b.t);
        }
    };

    // ---------------------------------------------------------- the scenes ----
    const HOOK_LENS = [COLUMN, 165, 960, 750];
    const SIDE = [COLUMN, 110, 960, 860];
    // A lens of the focus's own shape, centred: nothing shown that the shot did not ask for.
    const fitted = (focus) => {
        const h = Math.round(960 * focus[3] / focus[2]);
        return {lens: [COLUMN, (1080 - h) / 2, 960, h], focus};
    };
    const topOf = (sel) => doc.querySelector(sel).getBoundingClientRect().top + BAR;
    // The on-page card and a margin, the window closing round it: the verdict and nothing else.
    const card = () => {
        const n = doc.getElementById('fillsmith-hud');
        if (!n) return fitted([500, 590, 450, 200]);
        const r = n.getBoundingClientRect();
        return fitted([r.left - 28, r.top + BAR - 28, r.width + 56, r.height + 56]);
    };

    const SHOTS = {
        hook(u, s) {
            caret(u, s);
            // The left column, cut in its gutters: the field being typed into and nothing sliced.
            const near = {lens: HOOK_LENS, focus: [24, 50, 456, 356]};
            shoot(mixShot(near, WHOLE, rise(u, s.dur - .95, .95, move)));
        },
        fill(u, s) {
            const input = doc.getElementById('requester');
            input.style.borderColor = '';
            input.style.boxShadow = '';
            // The card is twelve-pixel type at this size: when it has its verdict, the camera goes to it.
            shoot(mixShot(WHOLE, card(), rise(u, s.cardAt, .9, move)));
        },
        controls(u, s) {
            /* A column each, from the gap above the label down, at the lens's own
             * shape: the cut falls between controls, never through one. */
            const L = 40, R = 480, W = 440, H = 394;
            const frames = {
                country: [L, topOf('#lbl-country') - 10, W, H],
                golive: [R, topOf('#lbl-date') - 10, W, H],
                screenshot: [R, topOf('label[for="screenshot"]') - 10, W, H],
                notes: [L, topOf('#notes') - 10, W, H]
            };
            // Each move runs to its end, however soon the next caption arrives.
            let shot = {lens: SIDE, focus: frames[s.shots[0].on]};
            for (const sh of s.shots.slice(1)) {
                shot = mixShot(shot, {lens: SIDE, focus: frames[sh.on]}, rise(u, sh.at - .2, .7, move));
            }
            shoot(shot);
        },
        person(u, s) {
            // The fields alone, no page header: the values are the scene.
            const a = doc.querySelector('label[for="name"]').getBoundingClientRect();
            const b = doc.getElementById('country').getBoundingClientRect();
            shoot(fitted([a.left - 18, a.top + BAR - 14, b.right - a.left + 36, b.bottom - a.top + 30]));
            for (const tk of s.ties) tie(u, tk, tk.at);
        },
        ai(u) {
            // The ticket and the first lines of the notes: the two the model rewrites, large enough to watch change.
            shoot(fitted([24, topOf('label[for="ticket"]') - 10, 456, 285]));
        }
    };

    const STILL = {
        ai(u, s) {
            const t = s.els.text;
            const img = capture('pill');
            placeCard(img, 120, parseFloat(t.style.top) + t.offsetHeight + 48, 3, rise(u, s.pill.at, .6), 0, 24, true);
        },
        repeat(u, s) {
            const n = clamp(Math.floor((u - s.seed.at) / s.seed.every) + 1, 0, FILL.seed.length);
            const seed = capture(`seed-${n}`), dbg = capture('debug');
            // As wide as the window in every other scene, whatever width the popup draws them at.
            const gap = 36, pad = 30, Z = (960 - pad * 2) / (dbg.naturalWidth / POPUP_SCALE);
            const sh = seed.naturalHeight / POPUP_SCALE * Z + pad * 2, h = sh + gap + dbg.naturalHeight / POPUP_SCALE * Z + pad * 2;
            // Centred on what is there: the seed alone, then the pair, the stack easing up as the second arrives.
            const top = lerp((1080 - sh) / 2, (1080 - h) / 2, rise(u, s.debug.at, .7, move));
            const r = placeCard(seed, COLUMN, top, Z, rise(u, .15, .6), pad);
            placeCard(dbg, COLUMN, top + r.h + gap, Z, rise(u, s.debug.at, .7), pad);
            // The lower card over the upper one's shadow, or the shadow lies across it like a smudge.
            seed.style.zIndex = '1';
            dbg.style.zIndex = '2';
        },
        end(u) {
            const e = $('#end');
            [...e.children].forEach((c, i) => {
                // Arriving with the push, not after it: an end card that comes in empty reads as a gap.
                const k = rise(u, .05 + i * .1, .8);
                c.style.opacity = String(k);
                c.style.transform = `translateY(${(1 - k) * 26}px)`;
            });
        }
    };
</script>
</body>
</html>

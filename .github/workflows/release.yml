# A tag is the only thing that publishes. `npm run package` builds the same ZIP
# a store upload would get — an allow-list of manifest, src and icons — and the
# suites run first, because a release is public and permanent.
#
#   git tag v1.0.0 && git push origin v1.0.0
name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium is a 150 MB download per run; keep it between runs, keyed by the version the lockfile pins.
      - name: playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm test

      # The tag says which build this is, so it has to be the build in the tree.
      - name: the tag matches the manifest
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match manifest version $version" >&2
            exit 1
          fi

      - run: npm run package

      # Notes are the commit subjects since the previous tag: this project's
      # history is one landed change per commit, and that is the changelog.
      # GitHub's own generated notes list pull requests, and a release cut from
      # direct commits got a bare compare link and nothing else.
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(node -p "require('./manifest.json').version")
          prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          {
            git log ${prev:+"$prev.."}"$tag" --no-merges --format='- %s'
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/$prev...$tag"
            fi
          } > release-notes.md
          gh release create "$tag" "formforge-$version.zip" \
            --title "FormForge $version" \
            --notes-file release-notes.md
